title: Multiple Failed Logons from Single Source
id: 100013-sigma
status: experimental
description: Обнаружение множественных неудачных попыток входа в Windows (T1110 – Brute Force)
references:
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential_access
  - attack.t1110
author: albert
date: 2026/08/04
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  timeframe: 60s
  condition: selection | count() by TargetUserName, IpAddress > 10
falsepositives:
  - Легитимный пользователь забыл пароль
  - Сервисный аккаунт с истёкшим паролем
level: high