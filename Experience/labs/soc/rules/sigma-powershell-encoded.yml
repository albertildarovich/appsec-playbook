title: PowerShell Encoded Command Execution
id: 100011-sigma
status: experimental
description: Обнаружение powershell.exe с закодированной командой (T1059.001)
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1059.001
author: albert
date: 2026/08/04
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains|all:
      - '-enc'
    CommandLine|contains:
      - 'SQBFAFgA'
      - 'JAB'
      - 'aWV4'
  condition: selection_img and selection_flags
falsepositives:
  - Легитимные administrative скрипты
level: high