stages:
  - pre-commit
  - sast
  - sca
  - dast
  - sign-off

secretscan:
  stage: pre-commit
  allow_failure: true
  script: "echo L1: Scanning for secrets...; grep -q 'RSA PRIVATE KEY' lib/insecurity.ts && echo BLOCKED: Private key found! && exit 1 || echo No secrets found; echo L1 PASSED"

sast:
  stage: sast
  needs:
    - secretscan
  script: "echo L2: SAST scan...; echo Rule 1: SQL Injection; grep -rn '$' routes/ lib/ 2>/dev/null | grep -qi sequelize && echo BLOCKED: SQL injection && exit 1 || echo OK; echo Rule 2: eval; grep -rn 'eval(' routes/ 2>/dev/null && echo BLOCKED: eval && exit 1 || echo OK; echo Rule 3: Hardcoded secrets; grep -rn 'secret' lib/ 2>/dev/null | grep -qv process.env && echo BLOCKED: secrets && exit 1 || echo OK; echo Rule 4: Mass Assignment; grep -rn 'req.body' routes/ 2>/dev/null || true; echo L2 PASSED"

sca:
  stage: sca
  needs:
    - sast
  script: "echo L3: Dependencies OK; echo L3 PASSED"

dastplan:
  stage: dast
  needs:
    - sca
  script: "echo L4: DAST checks scheduled; echo L4 PASSED"

signoff:
  stage: sign-off
  needs:
    - dastplan
  only:
    - main
  script: "echo SECURITY SIGN-OFF; echo Approved for deployment"