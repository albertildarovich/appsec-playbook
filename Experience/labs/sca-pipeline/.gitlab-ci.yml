# SCA Pipeline: Trivy + OWASP Dependency-Check + SBOM (CycloneDX)
# Стадии: sca (Trivy) -> sbom (CycloneDX) -> gate (блокировка) -> publish

stages:
  - sca
  - sbom
  - gate
  - publish

variables:
  TRIVY_DB_CACHE: "trivy-db"
  TRIVY_VERSION: "0.50.1"

# --- L1: Trivy fs, сканирование зависимостей ---
sca-trivy-fs:
  stage: sca
  image: aquasec/trivy:${TRIVY_VERSION}
  script:
    - trivy fs --format sarif --output trivy.sarif .
    - trivy fs --severity CRITICAL --ignore-unfixed --exit-code 1 .
    - trivy fs --format json --output trivy.json .
  cache:
    key: ${TRIVY_DB_CACHE}
    paths:
      - $HOME/.cache/trivy
  artifacts:
    reports:
      dependency_scanning: trivy.sarif
    paths:
      - trivy.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# --- L1b: OWASP Dependency-Check, ночной прогон ---
dependency-check:
  stage: sca
  image: owasp/dependency-check:10.0.0
  script:
    - dependency-check
        --scan .
        --format SARIF
        --out dependency-check.sarif
        --failOnCVSS 9
  artifacts:
    reports:
      dependency_scanning: dependency-check.sarif
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# --- L2: SBOM в формате CycloneDX ---
sbom-cyclonedx:
  stage: sbom
  image: cyclonedx/cyclonedx-npm:1.18.0
  script:
    - cyclonedx-bom --output sbom-cdx.json
  artifacts:
    paths:
      - sbom-cdx.json
    expire_in: 365 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# --- L3: Gate, блокировка по CVSS ---
sca-gate:
  stage: gate
  image: aquasec/trivy:${TRIVY_VERSION}
  script:
    - |
      echo "=== Слияние результатов ==="
      echo "Trivy: CRITICAL/HIGH --exit-code 1 (блокировка)"
      echo "Dependency-Check: --failOnCVSS 9 (блокировка)"
    - trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# --- L4: Публикация SBOM ---
publish-sbom:
  stage: publish
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - curl -X POST
        -H "JOB-TOKEN: $CI_JOB_TOKEN"
        -F "file=@sbom-cdx.json"
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/sbom/$CI_COMMIT_TAG/sbom-cdx.json"
  rules:
    - if: '$CI_COMMIT_TAG'